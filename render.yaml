services:
  - type: web
    name: dar-system-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_ALLOWED_HOSTS
        value: "*.onrender.com,dar-system-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dar-docs-coral.vercel.app,http://localhost:5173,http://localhost:8000"
